[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "image-gen-mcp"
version = "0.2.0"
description = "Image Gen MCP — FastMCP + FastAPI server for image generation and editing using Google Gemini"
requires-python = ">=3.11"
dependencies = [
    "aiohttp~=3.13.3",
    "fastapi~=0.135.1",
    "fastmcp~=3.1.0",
    "google-genai~=1.66.0",
    "Pillow~=12.1.1",
    "prefab-ui~=0.11.0",
    "uvicorn~=0.41.0",

]

[project.scripts]
image-gen-mcp = "image_gen_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["image_gen_mcp"]
